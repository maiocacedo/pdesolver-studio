name: Tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        # numpy + pdesolver enable the heat-solver test; without them it skips.
        run: pip install pytest numpy git+https://github.com/maiocacedo/PDESsolver.git
      - run: python -m pytest -q
