name: Build and Release Studio

on:
  push:
    tags:
      - 'v*'
      - '*v'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            asset_name: pdesolver-studio-windows.zip
          - os: macos-latest
            asset_name: pdesolver-studio-mac.zip
          - os: ubuntu-latest
            asset_name: pdesolver-studio-linux.zip
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Package
        run: |
          python build_studio.py

      - name: Zip build output
        run: |
          python -c "import shutil, sys; base = 'pdesolver-studio.app' if sys.platform == 'darwin' else 'pdesolver-studio'; shutil.make_archive('dist/${{ matrix.asset_name }}'[:-4], 'zip', 'dist', base)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            */*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
